name: Android Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Inject google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Skripzy Mobile.apk"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: android-latest
          name: Skripzy Mobile - Latest Release
          body: |
            Versi terbaru aplikasi Android Skripzy.
            Install APK ini untuk pengalaman native di HP Android kamu.
          files: "Skripzy Mobile.apk"
          make_latest: true
